[project]
name = "running-coach"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jadosh123", email = "jadosh2000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "garminconnect[workout]>=0.3.13",
    "mcp[cli]>=2.2.0",
    "platformdirs>=4.11.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
running-coach = "running_coach:main"
garmin-auth = "running_coach.garmin:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
